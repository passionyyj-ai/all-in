<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ALLIN 회원</title><link rel="stylesheet" href="styles.css?v=5.7.7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="/all-in/manifest-member.webmanifest?v=5.7.7">
<link rel="apple-touch-icon" href="/all-in/icon-member-192.png?v=577">
<meta name="apple-mobile-web-app-title" content="ALLIN 회원">
<meta name="application-name" content="ALLIN 회원">
<meta name="theme-color" content="#e91e63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
<div id="memberLoginView" class="login-wrap"><div class="login-card">
<div class="hero"><img class="club-logo" src="allin-logo.png" alt="ALLIN JOKGUCLUB 로고"><h1>올인 족구단</h1><div class="club-subtitle">ALLIN JOKGUCLUB · 2023</div><p>회원 로그인</p></div>
<div class="stack"><input id="memberLoginId" autocomplete="username" placeholder="회원 이름"><input id="memberLoginPw" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="개인 4자리 PIN"><button class="btn dark" onclick="memberLogin()">로그인</button></div>
<div id="memberLoginError" style="color:#dc2626;font-size:13px;text-align:center;margin-top:10px"></div>
</div></div>
<div id="memberAppView" class="member-wrap hidden"><div class="member-card">
<div class="hero"><img class="club-logo" src="allin-logo.png" alt="ALLIN JOKGUCLUB 로고"><h1>올인 족구단</h1><div class="club-subtitle">ALLIN JOKGUCLUB · 2023</div><p>일요일 모임 참석 여부를 직접 체크하세요.</p></div>
<div id="configWarn" class="notice hidden">Supabase 연결 전입니다. <b>config.js</b> 설정을 먼저 완료하세요.</div>
<div id="meetingBox" class="meeting-box"><small>다가오는 모임</small><div class="date" id="meetingDate">불러오는 중...</div><div id="meetingMeta" style="margin-top:6px;color:#cbd5e1;font-size:13px"></div></div>
<div id="attendanceSummary" class="attendance-summary"></div>
<div id="attendancePeople" class="attendance-people"></div>
<div id="currentReferee" class="referee-card hidden"></div>
<div id="checkPanel" class="hidden" style="margin-top:14px">
  <div id="currentStatus"></div>
  <div class="row" style="margin-top:10px"><button class="btn green" style="flex:1" onclick="setAttendance(true)">참석</button><button class="btn red" style="flex:1" onclick="setAttendance(false)">불참</button></div>
</div>
<div class="member-session-bar" style="margin-top:14px">
  <div><b id="loginMemberName"></b>님의 참석 여부만 변경할 수 있습니다.</div>
  <button type="button" class="member-logout-btn" onclick="memberLogout()">로그아웃</button>
</div>
<div class="title" style="margin-top:20px"><h2>나의 회비 입금 현황</h2><input id="memberDashMonth" type="month" onchange="loadMemberDashboard()"></div>
<div class="card dashboard-readonly"><div id="feeDashboard"></div></div>
<div class="title"><h2>수입 · 지출 현황</h2></div>
<div class="card dashboard-readonly"><div id="cashDashboard"></div></div>
<div class="title"><h2>나의 게임비 납부 현황</h2></div>
<div class="card dashboard-readonly"><div id="gameDueDashboard"></div></div>

<div class="delegate-admin-card" style="margin-top:18px">
  <div><b>대리 운영이 필요한가요?</b><br><span>총무 부재 시 참석 관리와 경기 운영을 대신할 수 있습니다.</span></div>
  <button type="button" class="btn dark" onclick="openDelegateAdmin()">경기 운영</button>
</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=5.7.7"></script><script src="common.js?v=5.7.7"></script><script src="member.js?v=5.7.7"></script><script src="pwa-member.js?v=5.7.7"></script>
</body></html>
