</nav></aside><main class="main"><div class="top"><div><div class="title">재고관리</div><div class="hint">사무실 및 병원별 기준재고와 현재고를 조회합니다.</div></div><div class="actions"><button class="btn" onclick="exportBackup()">JSON 백업</button><button class="btn" onclick="document.getElementById('restoreFile').click()">JSON 복원</button><input id="restoreFile" type="file" accept=".json" class="hidden" onchange="restoreBackup(event)"><button class="btn danger" onclick="resetAll()">초기화</button><span id="autosaveStatus" class="autosave-status">자동저장 준비</span></div></div><section><div class="card compact"><h3>재고 조회</h3><div class="row-4"><div><label>위치</label><select id="invLoc" onchange="renderInventory()"></select></div><div><label>제품카테고리</label><select id="invCat" onchange="renderInventory()"></select></div><div><label>품목명</label><input id="invSearch" oninput="renderInventory()"></div><div><label>&nbsp;</label><button class="btn primary" onclick="renderInventory()">조회</button></div></div><div class="toolbar mt"><button type="button" class="btn" onclick="downloadInventorySample()">재고업로드 샘플</button><button class="btn" onclick="exportInventoryCSV()">재고 CSV 내보내기</button><input type="file" id="invFile" accept=".xlsx,.xls" onchange="handleInventoryUpload(event)"></div><div id="invUploadResult" class="mt"></div></div><div class="card"><h3>재고 목록</h3><div class="table-wrap"><table><thead><tr><th>제품카테고리</th><th>품목명</th><th>재고</th><th>현재고</th><th>입고</th><th>사용</th><th>선납</th><th>기준재고</th><th>상태</th></tr></thead><tbody id="inventoryTable"></tbody></table></div></div></section></main></div><script src="js/vendor-core.js?v=1214"></script><script src="js/config.js?v=1214"></script><script src="js/cloud.js?v=1217"></script><script src="js/common.js?v=1217"></script>
<script src="js/inventory.js"></script><script>
async function downloadInventorySample(){
  const fileName='Inventory_upload.xlsx';
  const fileUrl=new URL('./sample/'+fileName,window.location.href);
  fileUrl.searchParams.set('download',Date.now().toString());
  try{
    const response=await fetch(fileUrl.href,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const blob=await response.blob();
    const blobUrl=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=blobUrl;
    link.download=fileName;
    link.style.display='none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(blobUrl),1000);
  }catch(error){
    window.location.href=fileUrl.href;
  }
}
</script></body></html>
