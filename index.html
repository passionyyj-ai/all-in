<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>올인 족구단</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="memberLoginView" class="login-wrap"><div class="login-card">
<div class="hero"><div class="ball">⚽</div><h1>올인 족구단</h1><p>회원 로그인</p></div>
<div class="stack"><input id="memberLoginId" autocomplete="username" placeholder="아이디"><input id="memberLoginPw" type="password" autocomplete="current-password" placeholder="비밀번호"><button class="btn dark" onclick="memberLogin()">로그인</button></div>
<div id="memberLoginError" style="color:#dc2626;font-size:13px;text-align:center;margin-top:10px"></div>
</div></div>
<div id="memberAppView" class="member-wrap hidden"><div class="member-card">
<div class="hero"><div class="ball">⚽</div><h1>올인 족구단</h1><p>일요일 모임 참석 여부를 직접 체크하세요.</p></div>
<div id="configWarn" class="notice hidden">Supabase 연결 전입니다. <b>config.js</b> 설정을 먼저 완료하세요.</div>
<div id="meetingBox" class="meeting-box"><small>다가오는 모임</small><div class="date" id="meetingDate">불러오는 중...</div><div id="meetingMeta" style="margin-top:6px;color:#cbd5e1;font-size:13px"></div></div>
<div class="field"><label>내 이름 선택</label><input id="memberSearch" placeholder="이름 검색" autocomplete="off"></div>
<div id="memberList" class="member-list" style="margin-top:8px"></div>
<div id="checkPanel" class="hidden" style="margin-top:14px">
  <div id="currentStatus"></div>
  <div class="stack" style="margin-top:10px"><input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="나의 4자리 참석 PIN">
  <div class="row"><button class="btn green" style="flex:1" onclick="setAttendance(true)">참석</button><button class="btn red" style="flex:1" onclick="setAttendance(false)">불참</button></div></div>
</div>
<div class="notice" style="margin-top:14px">회원 이름을 선택하고 개인 4자리 PIN으로 본인 참석 여부만 변경할 수 있습니다.</div>
<a href="admin.html" style="display:block;text-align:center;color:#6b7280;font-size:12px;margin-top:18px">총무 관리자</a>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="member.js"></script></body></html>
