<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>병원별 판매단가 - 대경 Tracking</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">대경 Tracking</div>
    <div class="sub">의료기기 재고 · 선납 · 사용 · 회수 관리</div>
    <nav class="nav">
<a class="page-link" href="index.html">📊 Dashboard</a>
<a class="page-link" href="transaction.html">🧾 거래관리</a>
<a class="page-link" href="inventory.html">📦 재고관리</a>
<a class="page-link" href="master.html">📁 품목 Master</a>
<a class="page-link" href="hospital.html">🏥 병원 Master</a>
<a class="page-link" href="hospital_price.html">🏷️ 병원별 판매단가</a>
<a class="page-link" href="price.html">💰 단가관리</a>
<a class="page-link" href="report.html">📈 보고서</a>
<a class="page-link" href="audit.html">🔍 재고 감사</a>
<a class="page-link" href="settings.html">⚙️ 환경설정</a>
</nav>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <div class="title">병원별 판매단가</div>
        <div class="hint">병원 Master에 등록된 병원별로 품목 판매단가를 관리합니다.</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="exportBackup()">JSON 백업</button>
        <button class="btn" onclick="document.getElementById('restoreFile').click()">JSON 복원</button>
        <input id="restoreFile" type="file" accept=".json" class="hidden" onchange="restoreBackup(event)">
        <button class="btn danger" onclick="resetAll()">초기화</button><span id="autosaveStatus" class="autosave-status">자동저장 준비</span>
      </div>
    </div>
    
<section>
  <div class="card compact">
    <h3>병원별 판매단가 조회</h3>
    <div class="row-4">
      <div><label>병원</label><select id="hpHospital" onchange="renderHospitalPrice()"></select></div>
      <div><label>제품카테고리</label><select id="hpCategory" onchange="renderHospitalPrice()"></select></div>
      <div><label>품목명</label><input id="hpKeyword" oninput="renderHospitalPrice()"></div>
      <div><label>&nbsp;</label><button class="btn primary" onclick="renderHospitalPrice()">조회</button></div>
    </div>
    <div class="toolbar mt">
      <button class="btn primary" onclick="saveVisibleHospitalPrices()">화면 단가 저장</button>
      <a class="btn" href="./sample/HospitalPrice_upload.xlsx" download="HospitalPrice_upload.xlsx">업로드 샘플 다운로드</a>
      <button class="btn" onclick="exportHospitalPriceCSV()">CSV 내보내기</button>
      <input type="file" accept=".xlsx,.xls" onchange="handleHospitalPriceUpload(event)">
    </div>
    <div id="hpResult" class="mt"></div>
  </div>

  <div class="card">
    <h3>병원 × 품목 판매단가</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>병원명</th><th>ID</th><th>제품카테고리</th><th>품목명</th><th>기본판매단가</th><th>병원판매단가</th><th>매입단가</th><th>예상마진</th><th>마진율</th></tr></thead>
        <tbody id="hospitalPriceTable"></tbody>
      </table>
    </div>
  </div>
</section>

  </main>
</div>
<script src="js/vendor-core.js?v=1214"></script><script src="js/config.js?v=1214"></script><script src="js/cloud.js?v=1217"></script><script src="js/common.js?v=1217"></script>
<script src="js/hospital_price.js"></script>
</body>
</html>
