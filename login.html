<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 - 대경 Tracking</title><link rel="stylesheet" href="css/style.css?v=1210"></head><body class="login-page"><main class="login-shell"><section class="login-card"><div class="cloud-mark">☁</div><h1>대경 Tracking</h1><p class="hint">발급받은 대경 계정으로 로그인하세요.</p><label>아이디</label><input id="loginUsername" type="text" autocomplete="username"><label>비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password"><button class="btn primary login-btn" id="loginBtn">로그인</button><div id="loginMessage" class="hint mt"></div><div class="cloud-help">계정 등록·수정·비밀번호 초기화는 관리자가 사이트의 <b>환경설정 → 사용자 관리</b>에서 처리합니다.</div></section></main><script src="js/vendor-core.js?v=1214"></script><script src="js/config.js?v=1214"></script><script src="js/cloud.js?v=1217"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{await DKCloud.requireAuth();}catch(e){}const btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMessage');async function go(){const username=document.getElementById('loginUsername').value.trim(),password=document.getElementById('loginPassword').value;if(!username||!password){msg.textContent='아이디와 비밀번호를 입력하세요.';return;}btn.disabled=true;msg.textContent='로그인 확인 중...';try{await DKCloud.signIn(username,password);location.replace(localStorage.getItem('DK_LAST_PAGE_V10')||'index.html');}catch(e){msg.textContent='로그인 실패: '+(e.message||e);}finally{btn.disabled=false;}}btn.onclick=go;document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')go();});});</script></body></html>
